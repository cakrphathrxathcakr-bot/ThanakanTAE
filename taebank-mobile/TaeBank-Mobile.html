  <style>
:root {
  color-scheme: dark;
  --bg: #101211;
  --panel: #191c19;
  --panel-raised: #20241f;
  --panel-hover: #272c25;
  --paper: #f6f3ea;
  --muted: #92988e;
  --faint: #7f8b78;
  --line: rgba(228, 234, 220, .105);
  --gold: #e7c88a;
  --gold-bright: #f0d8a8;
  --gold-dim: rgba(231, 200, 138, .1);
  --green: #91c8a8;
  --red: #ee9a91;
  --radius: 22px;
  --font: 'Manrope', 'Noto Sans Thai', sans-serif;
  font-family: var(--font);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
html { min-width: 320px; background: var(--bg); scroll-behavior: smooth; }
body { margin: 0; color: var(--paper); background: var(--bg); font-size: 15px; line-height: 1.65; }
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
button, a, input, select, textarea { touch-action: manipulation; }
button { color: inherit; }
button:disabled { cursor: not-allowed; opacity: .46; }
input, select, textarea { min-width: 0; }
a { color: var(--gold); text-decoration: none; }
button, a { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid var(--gold); outline-offset: 4px;
}
svg { width: 22px; height: 22px; flex-shrink: 0; vertical-align: middle; }
img { max-width: 100%; }
h1, h2, h3, p { margin: 0; }
strong { font-weight: 750; }
::selection { color: #181b16; background: var(--gold); }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.mobile-only { display: none; }

/* A compact, quiet frame puts the account itself in the foreground. */
.app-shell { min-height: 100dvh; padding-left: 228px; }
.desktop-sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; width: 228px; display: flex; flex-direction: column; padding: 34px 22px 24px; border-right: 1px solid var(--line); background: #121512; }
.desktop-sidebar .brand-lockup { margin: 0 12px 54px; }
.desktop-sidebar nav { display: flex; flex-direction: column; gap: 8px; }
.desktop-sidebar .nav-item { display: flex; align-items: center; gap: 13px; min-height: 52px; border: 1px solid transparent; border-radius: 12px; padding: 12px 16px; color: var(--muted); background: transparent; font-weight: 650; text-align: left; }
.desktop-sidebar .nav-item.active { color: var(--gold); background: var(--gold-dim); border-color: rgba(231, 200, 138, .1); }
.desktop-sidebar .nav-item:hover { color: var(--paper); background: var(--panel); }
.desktop-sidebar .nav-item.active:hover { color: var(--gold); background: var(--gold-dim); }
.desktop-sidebar .sidebar-bottom { margin-top: auto; padding: 24px 12px 0; border-top: 1px solid var(--line); }
.desktop-sidebar .sidebar-label { color: var(--faint); font-size: 12px; letter-spacing: .1em; }
.desktop-sidebar .sidebar-note { margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.75; }
.app-main { max-width: 1304px; margin: 0 auto; padding: 0 44px 42px; }
.topbar { height: 102px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
.topbar > .brand-lockup { display: none; }
.brand-lockup { display: inline-flex; align-items: center; gap: 11px; white-space: nowrap; }
.brand-mark { width: 36px; height: 36px; display: grid; place-items: center; color: var(--gold); }
.brand-mark svg { width: 36px; height: 36px; }
.brand-word { font-size: 23px; font-weight: 800; line-height: 1; letter-spacing: -.055em; color: var(--paper); }
.brand-word span { font-weight: 400; color: var(--gold); }
.eyebrow { color: var(--muted); font-size: 12px; font-weight: 650; line-height: 1.5; letter-spacing: .14em; text-transform: uppercase; }
.topbar > .eyebrow { color: var(--faint); letter-spacing: .11em; }
.topbar-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--muted); }
.icon-btn:hover { background: var(--panel); color: var(--paper); }
.icon-btn svg { width: 19px; height: 19px; }
.avatar { display: inline-grid; place-items: center; flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%; border: 1px solid #495040; background: #2e382b; color: #d6e1cc; font-size: 14px; font-weight: 750; }
.bottom-nav { display: none; }
.demo-banner { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 39px; padding: 9px 18px; color: #d6c69f; border-bottom: 1px solid rgba(231, 200, 138, .11); background: #27271d; font-size: 12px; line-height: 1.6; text-align: center; }
.demo-banner svg { width: 15px; height: 15px; }
.demo-banner button { padding: 0; border: 0; color: var(--gold-bright); background: none; font-size: 12px; font-weight: 750; text-decoration: underline; text-underline-offset: 3px; }
#view { animation: view-in .25s ease-out both; }
.page-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding: 33px 0 27px; }
.page-heading h1 { margin-top: 6px; font-size: clamp(25px, 2.5vw, 34px); font-weight: 650; line-height: 1.5; letter-spacing: -.04em; }
.page-heading h1 span { color: var(--gold); }
.page-heading p { margin-top: 6px; color: var(--muted); font-size: 13px; }
.heading-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(285px, 1fr); gap: 26px; align-items: start; }
.main-column, .side-column { min-width: 0; display: flex; flex-direction: column; gap: 22px; }

/* The warm metal card is intentionally the only bright surface. */
.balance-card { position: relative; isolation: isolate; overflow: hidden; min-height: 276px; padding: 27px 30px 25px; border: 1px solid #efdbaf; border-radius: 23px; color: #2b2b23; background: radial-gradient(ellipse at 5% 10%, rgba(255, 248, 221, .6), transparent 55%), linear-gradient(115deg, #d4b67c 0%, #ead5a8 48%, #dbc395 100%); box-shadow: 0 15px 48px rgba(0, 0, 0, .12); }
.balance-card::before { content: ''; position: absolute; z-index: -1; inset: 0; pointer-events: none; opacity: .18; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.36' filter='url(%23n)'/%3E%3C/svg%3E"); mix-blend-mode: multiply; }
.card-decoration { position: absolute; z-index: -1; width: 375px; height: 375px; right: -183px; top: -37px; border: 1px solid rgba(106, 86, 46, .22); border-radius: 50%; box-shadow: 0 0 0 21px rgba(255,255,255,.055), 0 0 0 22px rgba(106,86,46,.15), 0 0 0 44px rgba(255,255,255,.035), 0 0 0 45px rgba(106,86,46,.14), 0 0 0 67px rgba(255,255,255,.03), 0 0 0 68px rgba(106,86,46,.11), 0 0 0 90px rgba(255,255,255,.035), 0 0 0 91px rgba(106,86,46,.09); transform: rotate(-15deg); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card-brand { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 800; line-height: 1.3; letter-spacing: -.055em; }
.card-brand svg { width: 23px; height: 23px; }
.card-brand span { font-weight: 500; }
.card-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 750; line-height: 1.3; letter-spacing: .16em; text-transform: uppercase; }
.card-badge svg { width: 13px; height: 13px; }
.card-amount-label { display: flex; align-items: center; gap: 9px; margin-top: 28px; color: #675b42; font-size: 12px; font-weight: 500; }
.card-amount-label .icon-btn { width: 44px; height: 44px; margin: -12px 0; border: 0; color: #75644a; }
.card-amount-label .icon-btn:hover { background: rgba(76, 60, 31, .08); color: #2b2b23; }
.card-amount-label .icon-btn svg { width: 16px; height: 16px; }
.balance-amount { position: relative; margin-top: 4px; font-size: clamp(31px, 3.2vw, 43px); font-weight: 750; line-height: 1.25; letter-spacing: -.055em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.balance-currency { margin-right: 6px; font-size: .64em; font-weight: 500; vertical-align: .08em; }
.balance-hidden { letter-spacing: .12em; }
.card-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: 28px; }
.account-number { color: #63583f; font-size: 12px; font-weight: 600; letter-spacing: .13em; }
.card-owner { margin-top: 3px; font-size: 13px; font-weight: 650; letter-spacing: -.01em; }
.card-chip { display: grid; place-items: center; width: 38px; height: 30px; border: 1px solid rgba(102, 78, 33, .4); border-radius: 7px; color: #897346; background: rgba(246, 227, 185, .42); }
.card-chip svg { width: 30px; height: 24px; stroke-width: 1; }
.balance-caption { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 11px; color: var(--faint); font-size: 12px; }
.balance-caption svg { width: 13px; height: 13px; }
.quick-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-top: -2px; }
.quick-action { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 9px; min-width: 0; min-height: 91px; padding: 5px 2px; border: 0; background: transparent; }
.quick-icon { width: 52px; height: 52px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 17px; background: var(--panel); color: var(--paper); transition: background .15s, border-color .15s, transform .15s; }
.quick-action:first-child .quick-icon { color: var(--gold); background: #292a21; border-color: rgba(231, 200, 138, .15); }
.quick-action:hover .quick-icon { transform: translateY(-2px); border-color: rgba(231, 200, 138, .35); background: var(--panel-hover); }
.quick-icon svg { width: 21px; height: 21px; stroke-width: 1.6; }
.quick-label { font-size: 12px; line-height: 1.5; color: #b5bbb0; text-align: center; }
.section-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 23px 14px; }
.section-title { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 650; letter-spacing: -.025em; }
.section-title svg { width: 19px; height: 19px; color: var(--gold); }
.section-body { padding: 4px 23px 23px; }
.text-btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; padding: 5px 0 5px 8px; border: 0; background: transparent; color: var(--gold); font-size: 12px; font-weight: 650; white-space: nowrap; }
.text-btn svg { width: 15px; height: 15px; }
.text-btn:hover { color: var(--gold-bright); }
.insight-card { padding: 24px; }
.insight-card .section-heading { padding: 0; }
.insight-card .eyebrow { color: var(--faint); letter-spacing: .07em; font-size: 12px; }
.insight-value { margin-top: 17px; font-size: 29px; line-height: 1.3; font-weight: 750; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.insight-value small { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
.spark-chart { position: relative; height: 112px; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-top: 25px; border-bottom: 1px solid var(--line); background: repeating-linear-gradient(to top, transparent, transparent calc(33.333% - 1px), rgba(228,234,220,.045) calc(33.333% - 1px), rgba(228,234,220,.045) 33.333%); }
.spark-bar { position: relative; width: 100%; max-width: 25px; height: var(--bar-height, 40%); border-radius: 5px 5px 0 0; background: #3c4434; transition: height .4s; }
.spark-bar:last-child { background: var(--gold); }
.spark-labels { display: flex; justify-content: space-between; margin-top: 10px; color: var(--faint); font-size: 12px; }
.insight-footer { display: flex; align-items: center; gap: 7px; margin-top: 19px; color: var(--muted); font-size: 12px; }
.insight-footer svg { width: 15px; height: 15px; color: var(--green); }
.insight-footer strong { color: var(--green); font-weight: 600; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.stat-card { position: relative; min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
.stat-icon { display: inline-grid; place-items: center; width: 35px; height: 35px; margin-bottom: 17px; border-radius: 11px; background: #2c3329; color: var(--green); }
.stat-icon svg { width: 18px; height: 18px; }
.stat-card:nth-child(2) .stat-icon { background: #332d24; color: var(--gold); }
.stat-label { color: var(--muted); font-size: 12px; }
.stat-value { margin-top: 4px; color: var(--paper); font-size: 21px; line-height: 1.4; font-weight: 750; letter-spacing: -.04em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-value small { color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0; }
.transaction-list { padding: 0 23px 7px; }
.transaction-row { display: flex; align-items: center; gap: 13px; min-height: 82px; padding: 17px 0; border-bottom: 1px solid var(--line); }
.transaction-row:last-child { border-bottom: 0; }
.transaction-icon { display: inline-grid; place-items: center; flex-shrink: 0; width: 43px; height: 43px; border-radius: 14px; color: #b4bbac; background: #292e26; }
.transaction-icon.deposit, .deposit .transaction-icon { color: #a4c8b0; background: #26362b; }
.transaction-icon.withdraw, .withdraw .transaction-icon { color: #d9bcb1; background: #372e29; }
.transaction-icon.interest, .interest .transaction-icon { color: var(--gold); background: #363022; }
.transaction-icon svg { width: 19px; height: 19px; }
.transaction-copy { min-width: 0; flex: 1; }
.transaction-title { font-weight: 600; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
.transaction-meta { margin-top: 3px; color: var(--faint); font-size: 12px; line-height: 1.5; }
.transaction-amount { margin-left: auto; font-size: 15px; font-weight: 700; letter-spacing: -.035em; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.transaction-amount small { display: block; margin-top: 3px; color: var(--faint); font-size: 12px; font-weight: 500; letter-spacing: 0; }
.transaction-amount.positive, .positive { color: var(--green); }
.transaction-amount.negative, .negative { color: #ddd4c7; }
.transaction-list > .text-btn { display: flex; width: 100%; margin: 6px 0 2px; padding: 10px; color: var(--muted); }
.empty-state { display: flex; flex-direction: column; align-items: center; padding: 42px 24px; color: var(--muted); text-align: center; font-size: 13px; }
.empty-state > svg { width: 34px; height: 34px; margin-bottom: 14px; color: var(--faint); }
.empty-state strong { margin-bottom: 5px; color: var(--paper); font-size: 15px; }
.chart-legend { display: flex; gap: 15px; flex-wrap: wrap; margin: 15px 0; color: var(--muted); font-size: 12px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.distribution-row { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 7px; color: var(--muted); font-size: 12px; }
.distribution-row strong { color: var(--paper); font-weight: 600; }
.distribution-track { height: 5px; overflow: hidden; border-radius: 4px; background: #2d332a; }
.distribution-fill { height: 100%; border-radius: inherit; background: var(--gold); }

/* Members, records and profile share one clear information rhythm. */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
.search-field { display: flex; align-items: center; gap: 11px; width: min(100%, 370px); min-height: 49px; padding: 0 16px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); color: var(--faint); }
.search-field svg { width: 19px; height: 19px; }
.search-field input { width: 100%; min-height: 47px; border: 0; outline: 0; background: transparent; color: var(--paper); font-size: 16px; }
.segment { white-space: nowrap; }
.login-role-tabs { display: flex; margin-top: 24px; }
.login-role-tabs .segment { flex: 1; min-height: 44px; }
.insight-card .section-heading .segmented { flex-shrink: 0; }
.search-field:focus-within { border-color: #958365; box-shadow: 0 0 0 3px rgba(231,200,138,.07); }
.search-field input:focus-visible { outline: 0; }
input::placeholder, textarea::placeholder { opacity: 1; color: #71796c; }
.filter-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.chip { min-height: 44px; padding: 7px 15px; border: 1px solid var(--line); border-radius: 30px; color: var(--muted); background: transparent; font-size: 12px; font-weight: 600; }
.chip.active { border-color: rgba(231,200,138,.24); color: var(--gold); background: var(--gold-dim); }
.chip:hover { color: var(--paper); border-color: #535b4b; }
.tableish-header { display: grid; grid-template-columns: 1fr 150px 105px; gap: 14px; padding: 14px 24px; border-bottom: 1px solid var(--line); color: var(--faint); font-size: 12px; }
.tableish-header > :nth-child(n+2) { text-align: right; }
.member-list { padding: 0 23px; }
.member-row { display: flex; align-items: center; gap: 12px; min-height: 87px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.member-row:last-child { border-bottom: 0; }
.member-row > .avatar { width: 40px; height: 40px; font-size: 13px; background: #2f342a; border-color: #414936; color: #c4cdbb; }
.member-main { min-width: 0; flex: 1; }
.member-name { font-size: 14px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
.member-meta { margin-top: 4px; color: var(--faint); font-size: 12px; }
.member-balance { margin-left: auto; min-width: 100px; font-size: 15px; font-weight: 700; letter-spacing: -.03em; text-align: right; font-variant-numeric: tabular-nums; }
.member-balance small { display: block; color: var(--faint); font-size: 12px; font-weight: 500; letter-spacing: 0; }
.member-actions { display: flex; justify-content: flex-end; gap: 7px; margin-left: 11px; }
.member-actions .icon-btn { width: 44px; height: 44px; border-radius: 11px; }
.member-actions .button-small { min-height: 44px; }
.profile-card { padding: 28px; }
.profile-card > .avatar { width: 68px; height: 68px; margin-bottom: 16px; font-size: 23px; }
.profile-card h2 { font-size: 24px; font-weight: 650; letter-spacing: -.035em; }
.profile-card > p { color: var(--muted); font-size: 13px; }
.profile-card .badge { margin-top: 13px; }
.profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 25px; margin-top: 28px; padding-top: 26px; border-top: 1px solid var(--line); }
.profile-field { color: var(--muted); font-size: 12px; }
.profile-value { margin-top: 5px; color: var(--paper); font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.settings-list { padding: 0 23px 8px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; width: 100%; min-height: 68px; padding: 17px 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--paper); text-align: left; }
.settings-row:last-child { border-bottom: 0; }
.settings-row > span:first-child { display: inline-flex; align-items: center; gap: 12px; font-size: 14px; }
.settings-row > span:last-child { color: var(--muted); font-size: 12px; }
.settings-row svg { width: 19px; height: 19px; color: var(--muted); }
.settings-row:hover { color: var(--gold); }
.badge { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 12px; font-weight: 650; line-height: 1.5; letter-spacing: .045em; }
.badge-gold { border-color: rgba(231,200,138,.14); color: var(--gold); background: var(--gold-dim); }
.badge-green { border-color: rgba(145,200,168,.14); color: var(--green); background: rgba(145,200,168,.07); }
.badge-muted { color: var(--muted); background: rgba(146,152,142,.07); }

/* Controls keep visible labels and generous touch targets. */
.button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 49px; padding: 11px 19px; border: 1px solid transparent; border-radius: 12px; color: var(--paper); background: var(--panel-raised); font-size: 14px; font-weight: 700; line-height: 1.6; text-align: center; transition: background .15s, border-color .15s, transform .15s; }
.button svg { width: 18px; height: 18px; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes view-in { from { opacity: .4; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes dialog-in { from { opacity: 0; transform: translateY(12px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

<script>
/* core.js */
/* TaeBank ledger: shared by the browser demo and the trusted server. */
(function (root) {
  'use strict';

  const TABLES = ['members', 'transactions', 'interestRuns', 'importRuns', 'printJobs', 'requests', 'audit'];
  const own = (object, key) => Object.prototype.hasOwnProperty.call(object || {}, key);

    Object.defineProperty(object, key, { value, enumerable: true, configurable: true, writable: true });

  }

  }

    const code = typeof value === 'number' ? String(value) : value;
    requireThat(typeof code === 'string' && /^\d{6}$/.test(code), 'INVALID_CODE', 'เลขบัญชีต้องเป็นตัวเลข 6 หลัก');

    return value;

    return result;

    const offset = safeAdd(line - 1, count);
    const nextPage = safeAdd(page, Math.floor(offset / 24));
    return { page: nextPage, line: offset % 24 + 1 };
  }

  function applyMutation(original, command, context) {
    assertState(original);
    context = context || {};
    requireThat(command && typeof command === 'object' && !Array.isArray(command), 'INVALID_COMMAND', 'คำสั่งไม่ถูกต้อง');
    const key = text(command.idempotencyKey, 200, 'รหัสคำขอ');
    const payload = stable(command);
    if (own(original.requests, key)) {
      requireThat(original.requests[key].payload === payload, 'IDEMPOTENCY_CONFLICT', 'รหัสคำขอนี้ถูกใช้กับข้อมูลอื่นแล้ว');
      return { state: clone(original), result: clone(original.requests[key].result) };
    }
    const state = clone(original);
    const now = context.now || new Date().toISOString();
    requireThat(typeof now === 'string' && /^\d{4}-\d\d-\d\dT/.test(now) && Number.isFinite(Date.parse(now)), 'INVALID_DATE', 'วันเวลารายการไม่ถูกต้อง');
    const actor = text(context.actor || 'demo', 200, 'ผู้ทำรายการ');
    let sequence = 0;
    function id(prefix, table) {
      for (let attempt = 0; attempt < 10; attempt++) {
        const raw = context.idFactory ? context.idFactory() : (root.crypto && root.crypto.randomUUID ? root.crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
        const generated = prefix + '_' + String(raw) + '_' + (++sequence);
        requireThat(generated.length < 250 && !/[.#$\[\]\/]/.test(generated), 'INVALID_ID', 'รหัสรายการไม่ถูกต้อง');
        if (!own(state[table], generated)) return generated;
      }
      fail('ID_COLLISION', 'ไม่สามารถสร้างรหัสรายการ กรุณาลองใหม่');
    }
    function member(code, active) {
      requireThat(own(state.members, code), 'MEMBER_NOT_FOUND', 'ไม่พบบัญชีนี้');
      const value = state.members[code];
      requireThat(!active || value.status === 'active', 'MEMBER_ARCHIVED', 'บัญชีนี้ถูกปิดแล้ว');
      return value;
    }
    function append(code, type, amount, note, extra) {
      satang(amount, false);
      const before = balance(state, code);
      if (type === 'withdraw') requireThat(availableBalance(state, code) >= amount, 'INSUFFICIENT_FUNDS', 'ยอดเงินไม่เพียงพอสำหรับรายการนี้');
      const after = safeAdd(before, type === 'deposit' ? amount : -amount);
      if (type === 'withdraw') requireThat(after >= 0, 'INSUFFICIENT_FUNDS', 'ยอดเงินไม่เพียงพอสำหรับรายการนี้');
      const transactionId = id('tx', 'transactions');
      put(state.transactions, transactionId, Object.assign({ id: transactionId, studentCode: code, type, amountSatang: amount, createdAt: now, note, actor }, extra || {}));
      return transactionId;
    }
    function makeMember(data) {
      const code = accountCode(data.code);
      const nick = text(data.nick, 48, 'ชื่อเล่น', true);
      const name = text(data.name, 120, 'ชื่อสมาชิก');
      return { code, nick, name, status: 'active', pbPage: 1, pbLine: 1, createdAt: now };
    }
    const action = command.action;
    let result;
    if (action === 'member.save') {
      const incoming = makeMember(command);
      const exists = own(state.members, incoming.code);
      if (exists) Object.assign(state.members[incoming.code], { name: incoming.name, nick: incoming.nick });
      else put(state.members, incoming.code, incoming);
      result = { action, code: incoming.code, created: !exists };
    } else if (action === 'member.archive') {
      const code = accountCode(command.code);
      const existing = member(code, true);
      requireThat(balance(state, code) === 0, 'NONZERO_BALANCE', 'ปิดบัญชีได้เมื่อยอดเงินคงเหลือเป็น 0 เท่านั้น');
      existing.status = 'archived';
      existing.archivedAt = now;
      result = { action, code };
    } else if (action === 'transact') {
      const code = accountCode(command.code);
      member(code, true);
      requireThat(command.type === 'deposit' || command.type === 'withdraw', 'INVALID_TYPE', 'เลือกฝากเงินหรือถอนเงิน');
      const transactionId = append(code, command.type, command.amountSatang, text(command.note, 240, 'หมายเหตุ', true));
      result = { action, code, transactionId, amountSatang: command.amountSatang, balanceSatang: balance(state, code) };
    } else if (action === 'reverse') {
      requireThat(typeof command.transactionId === 'string' && own(state.transactions, command.transactionId), 'TRANSACTION_NOT_FOUND', 'ไม่พบรายการต้นฉบับ');
      const source = state.transactions[command.transactionId];
      member(source.studentCode, true);
      requireThat(!source.reversalOf && !Object.values(state.transactions).some(tx => tx.reversalOf === source.id), 'ALREADY_REVERSED', 'รายการนี้กลับรายการแล้ว หรือเป็นรายการแก้ไข');
      requireThat(source.legacyFractionalSatang !== true, 'LEGACY_FRACTIONAL_AMOUNT', 'รายการเดิมมีเศษต่ำกว่าสตางค์ จึงไม่สามารถกลับรายการโดยไม่เปลี่ยนยอดเดิมได้');
      const reason = text(command.reason, 240, 'เหตุผลการกลับรายการ');
      const transactionId = append(source.studentCode, source.type === 'deposit' ? 'withdraw' : 'deposit', source.amountSatang, reason, { reversalOf: source.id });
      result = { action, code: source.studentCode, transactionId, reversalOf: source.id, balanceSatang: balance(state, source.studentCode) };
    } else if (action === 'interest') {
      requireThat(typeof command.period === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(command.period), 'INVALID_PERIOD', 'รอบดอกเบี้ยต้องเป็น YYYY-MM');
      requireThat(!own(state.interestRuns, command.period), 'INTEREST_ALREADY_RUN', 'รอบเดือนนี้จ่ายดอกเบี้ยแล้ว');
      const rateText = String(command.ratePercent == null ? '' : command.ratePercent).trim();
      requireThat(/^\d+(?:\.\d{1,6})?$/.test(rateText), 'INVALID_RATE', 'อัตราดอกเบี้ยไม่ถูกต้อง (ทศนิยมไม่เกิน 6 ตำแหน่ง)');
      const rate = Number(rateText);
      requireThat(Number.isFinite(rate) && rate > 0 && rate <= 100, 'INVALID_RATE', 'อัตราดอกเบี้ยต้องมากกว่า 0 และไม่เกิน 100%');
      const parts = rateText.split('.');
      const decimals = (parts[1] || '').length;
      const numerator = BigInt(parts[0] + (parts[1] || ''));
      const denominator = 100n * (10n ** BigInt(decimals));
      const note = text(command.note || `ดอกเบี้ยรอบ ${command.period}`, 240, 'หมายเหตุ', true);
      const transactionIds = [];
      let totalSatang = 0;
      Object.values(state.members).filter(value => value.status === 'active').forEach(value => {
        const current = balance(state, value.code);
        if (current <= 0) return;
        // Exact half-up rounding matches Math.round for positive values, without floating-point drift.

        const amount = Number(rounded);
        if (!amount) return;
        totalSatang = safeAdd(totalSatang, amount);
        transactionIds.push(append(value.code, 'deposit', amount, note, { isInterest: true, period: command.period }));
      });
      put(state.interestRuns, command.period, { period: command.period, ratePercent: rate, createdAt: now, actor, transactionIds, totalSatang });
      result = { action, period: command.period, ratePercent: rate, count: transactionIds.length, totalSatang, transactionIds };
    } else if (action === 'import') {
      const batchId = text(command.batchId, 200, 'รหัสไฟล์นำเข้า');
      requireThat(!own(state.importRuns, batchId), 'IMPORT_ALREADY_RUN', 'ไฟล์ชุดนี้ถูกนำเข้าแล้ว');
      requireThat(Array.isArray(command.rows) && command.rows.length > 0 && command.rows.length <= 10000, 'INVALID_IMPORT', 'ไฟล์นำเข้าต้องมีข้อมูล 1–10,000 บัญชี');
      const seen = new Set();
      const incoming = command.rows.map(row => {
        requireThat(row && typeof row === 'object', 'INVALID_IMPORT', 'ข้อมูลนำเข้าไม่ถูกต้อง');
        const value = makeMember(row);
        satang(row.balanceSatang, true);
        requireThat(!seen.has(value.code), 'DUPLICATE_IMPORT_CODE', `เลขบัญชี ${value.code} ซ้ำในไฟล์`);
        requireThat(!own(state.members, value.code), 'MEMBER_ALREADY_EXISTS', `เลขบัญชี ${value.code} มีอยู่แล้ว นำเข้าได้เฉพาะบัญชีใหม่`);
        seen.add(value.code);
        return { member: value, amount: row.balanceSatang };
      });
      const transactionIds = [];
      let totalSatang = 0;
      incoming.forEach(row => {
        put(state.members, row.member.code, row.member);
        totalSatang = safeAdd(totalSatang, row.amount);
        if (row.amount > 0) transactionIds.push(append(row.member.code, 'deposit', row.amount, 'ยอดยกมาจากการนำเข้า', { batchId }));
      });
      put(state.importRuns, batchId, { batchId, createdAt: now, actor, count: incoming.length, totalSatang, transactionIds });
      result = { action, batchId, count: incoming.length, totalSatang, transactionIds };
    } else if (action === 'print.confirm') {
      const code = accountCode(command.code);
      const existing = member(code, false);
      requireThat(Array.isArray(command.transactionIds) && command.transactionIds.length > 0, 'INVALID_PRINT', 'เลือกรายการที่พิมพ์สำเร็จ');
      requireThat(new Set(command.transactionIds).size === command.transactionIds.length, 'DUPLICATE_PRINT', 'มีรายการพิมพ์ซ้ำ');
      requireThat(command.page === existing.pbPage && command.line === existing.pbLine, 'STALE_PRINT_POSITION', 'ตำแหน่งสมุดเปลี่ยนไปแล้ว กรุณาเปิดตัวอย่างพิมพ์ใหม่');
      const sortedPending = Object.values(state.transactions).filter(tx => tx.studentCode === code && !tx.printedAt).sort((a, b) => a.createdAt.localeCompare(b.createdAt) || a.id.localeCompare(b.id));
      command.transactionIds.forEach((transactionId, index) => {
        requireThat(typeof transactionId === 'string' && own(state.transactions, transactionId), 'TRANSACTION_NOT_FOUND', 'ไม่พบรายการที่ต้องการพิมพ์');
        const tx = state.transactions[transactionId];
        requireThat(tx.studentCode === code, 'INVALID_PRINT_OWNER', 'รายการพิมพ์ไม่ตรงกับบัญชี');
        requireThat(!tx.printedAt, 'ALREADY_PRINTED', 'รายการนี้ได้รับการยืนยันพิมพ์แล้ว');
        requireThat(sortedPending[index] && sortedPending[index].id === transactionId, 'PRINT_OUT_OF_ORDER', 'ต้องพิมพ์รายการตามลำดับจากรายการเก่าสุด');
      });
      const next = nextPosition(command.page, command.line, command.transactionIds.length);
      requireThat(command.nextPage == null || command.nextPage === next.page, 'INVALID_PRINT_POSITION', 'หน้าถัดไปไม่ตรงกับจำนวนรายการ');
      requireThat(command.nextLine == null || command.nextLine === next.line, 'INVALID_PRINT_POSITION', 'บรรทัดถัดไปไม่ตรงกับจำนวนรายการ');
      const printJobId = id('print', 'printJobs');
      command.transactionIds.forEach((transactionId, index) => {
        const position = nextPosition(command.page, command.line, index);
        Object.assign(state.transactions[transactionId], { printedAt: now, printJobId, printedPage: position.page, printedLine: position.line });
      });
      existing.pbPage = next.page;
      existing.pbLine = next.line;
      put(state.printJobs, printJobId, { id: printJobId, code, transactionIds: command.transactionIds.slice(), page: command.page, line: command.line, nextPage: next.page, nextLine: next.line, confirmedAt: now, actor });
      result = { action, code, printJobId, count: command.transactionIds.length, nextPage: next.page, nextLine: next.line };
    } else fail('INVALID_ACTION', 'ไม่รู้จักคำสั่งนี้');

    const auditId = id('audit', 'audit');
    put(state.audit, auditId, { id: auditId, action, createdAt: now, actor, requestId: key, result: clone(result) });
    put(state.requests, key, { payload, result: clone(result), createdAt: now, actor });
    return { state, result };
  }

<script>
/* legacy-service.js */
/* Direct adapter for the original TaeBank database. Loading this file never writes data. */
(function (global) {
  'use strict';
  const TABLES = ['interestRuns', 'importRuns', 'printJobs', 'requests', 'audit'];

  function parseCSV(text) {
    text=text.replace(/^\uFEFF/,''); const rows=[]; let row=[],cell='',quoted=false;
    for(let i=0;i<text.length;i++) { const c=text[i]; if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;} else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c; }
    if(quoted)throw new Error('รูปแบบ CSV ไม่ถูกต้อง มีเครื่องหมายคำพูดที่ไม่ปิด');
    row.push(cell);if(row.some(v=>v.trim()))rows.push(row);if(rows.length<2)throw new Error('ไม่พบแถวข้อมูลในไฟล์');
    const headers=rows.shift().map(x=>x.trim()); const find=names=>headers.findIndex(h=>names.includes(h));
    const ci=find(['เลขที่บัญชี','เลขบัญชี','code']),ni=find(['ชื่อที่แสดง','ชื่อเล่น','nick','นมัสการ สามเณร..']),fi=find(['ชื่อจริง','ชื่อ–นามสกุล','ชื่อ-นามสกุล','name']),bi=find(['ยอดคงเหลือ','balance']);
    if(ci<0||fi<0||bi<0)throw new Error('ต้องมีคอลัมน์ เลขที่บัญชี, ชื่อจริง และยอดคงเหลือ');
    const seen=new Set(); return rows.map((r,i)=>{const code=String(r[ci]||'').trim(),name=String(r[fi]||'').trim(),nick=String(r[ni]||name).trim(),raw=String(r[bi]||'0').trim();if(!/^\d{6}$/.test(code))throw new Error(`แถว ${i+2}: เลขบัญชีต้องเป็นตัวเลข 6 หลัก`);if(seen.has(code)||snapshot.state.members[code])throw new Error(`แถว ${i+2}: บัญชี ${code} ซ้ำหรือมีอยู่แล้ว`);seen.add(code);if(!name)throw new Error(`แถว ${i+2}: กรุณาระบุชื่อจริง`);const amount=/^0(?:\.0{1,2})?$/.test(raw)?0:window.TaeCore.moneyToSatang(raw);return {code,nick,name,balanceSatang:amount};});

  async function fingerprint(text) {
    if(globalThis.crypto?.subtle) { const bytes=new TextEncoder().encode(text); const digest=await crypto.subtle.digest('SHA-256',bytes); return Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
    let hash=2166136261;for(const ch of text){hash^=ch.charCodeAt(0);hash=Math.imul(hash,16777619);}return `csv-${(hash>>>0).toString(16)}-${text.length}`;
  }

  });
  document.addEventListener('input',e=>{
    if(e.target.id==='member-search'){memberSearch=e.target.value;$('#member-results').innerHTML=memberRows(filteredMembers());$('#member-count').textContent=`พบ ${filteredMembers().length} บัญชี`;}
    if(e.target.id==='history-search'){historySearch=e.target.value;refreshHistory();}
  });
  document.addEventListener('change',e=>{if(e.target.id==='history-period')refreshHistory();});
  document.addEventListener('submit',async e=>{
    if(e.target.id!=='login-form')return;e.preventDefault();const button=$('button[type="submit"]',e.target);button.disabled=true;$('#login-error').textContent='';
    try{const credentials=snapshot.mode==='legacy'?(loginRole==='member'?{accountCode:$('#login-account').value.trim()}:{adminPin:$('#login-admin-pin').value,adminMasterKey:$('#login-master-key').value}):{email:$('#login-email').value.trim(),password:$('#login-password').value};await window.TaeService.signIn(credentials);activeView='home';render();}catch(error){$('#login-error').textContent=friendly(error);button.disabled=false;}
  });
  modal.addEventListener('cancel',e=>{if(submitting)e.preventDefault();else document.body.classList.remove('modal-open');});
  modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
  async function init() {
    try{
      const status=await window.TaeService.init();snapshot.mode=status.mode;
      window.TaeService.subscribe(next=>{const oldSession=snapshot.session?.uid;snapshot=next;if(!next.session&&oldSession)activeView='home';render();refreshHistory();if(next.warning&&next.warning!==latestWarning){latestWarning=next.warning;toast(next.warning,'error');}});
      snapshot=window.TaeService.getSnapshot();render();refreshHistory();
    }catch(error){app.innerHTML=`<main class="login-shell"><div class="empty-state">${icon('info')}<h1>ยังเปิดระบบไม่ได้</h1><p>${esc(friendly(error))}</p><p>ตรวจสอบการตั้งค่า หรือเปลี่ยนเป็นโหมดตัวอย่างใน firebase-config.js</p></div></main>`;}
  }
  init();
})();

</script>
</body>
</html>
